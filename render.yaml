services:
  # Backend API service
  - type: web
    name: trinetra-backend
    runtime: python
    buildCommand: "pip install -r requirements.txt && python ../database/apply_migrations.py && python ../database/seed/seed_madanapalle.py"
    startCommand: "python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    rootDir: backend
    plan: free
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: DB_PATH
        value: "../trinetra.db"
      - key: CORS_ORIGINS
        value: "*"
      - key: OSRM_BASE_URL
        value: "https://router.project-osrm.org"

